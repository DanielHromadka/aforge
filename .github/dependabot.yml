# Weekly dependency updates, minor and patch grouped into one PR so CI runs once; majors come one by one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      all: { patterns: ['*'] }

  - package-ecosystem: docker
    directories: [/runtime, /apps/relay, /deploy/production/agent, /deploy/production/egress, /deploy/production/ingress, /deploy/production/model-gateway, /deploy/production/playwright]
    schedule: { interval: monthly }
    groups:
      all: { patterns: ['*'] }
