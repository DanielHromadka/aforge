name: reactor
services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U keycloak -d keycloak]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 768m
    security_opt: [no-new-privileges:true]
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    command: [start, --import-realm]
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?required}
      KC_HOSTNAME: ${KEYCLOAK_URL:?required}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_HOST: 0.0.0.0
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_PASSWORD:-}
      JAVA_OPTS_KC_HEAP: '-Xms256m -Xmx768m'
    ports: ['127.0.0.1:8080:8080']
    volumes:
      - ${REACTOR_CONFIG_DIR:?required}/realm.json:/opt/keycloak/data/import/reactor-realm.json:ro
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 1400m
    security_opt: [no-new-privileges:true]
  egress:
    image: ${REACTOR_EGRESS_IMAGE:-reactor-egress:latest}
    container_name: reactor-egress
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /run, /var/log/squid, /var/spool/squid]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
  relay:
    image: ${REACTOR_RELAY_IMAGE:-reactor-relay:latest}
    restart: unless-stopped
    environment:
      PORT: 8787
      RELAY_TRUST_PROXY: 'true'
    ports: ['127.0.0.1:8787:8787']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
volumes:
  postgres:
